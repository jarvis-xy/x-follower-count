<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home / X (mock)</title>
<style>
  /* Minimal stand-in for react-native-web's atomic CSS on x.com:
     every View is a flex column unless it has a row class. */
  body { margin: 0; background: #fff; color: #0f1419; font: 15px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body.dark { background: #000; color: #e7e9ea; }
  .v { display: flex; flex-direction: column; align-items: stretch; box-sizing: border-box; min-width: 0; min-height: 0; position: relative; }
  .row { flex-direction: row; align-items: center; }
  .shrink { flex-shrink: 1; max-width: 100%; }
  .grow { flex-grow: 1; }
  .t { display: block; white-space: nowrap; }
  .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .ns { flex-shrink: 0; display: flex; }
  .muted { color: #536471; }
  a { color: inherit; text-decoration: none; }
  .col { width: 600px; border-left: 1px solid #eff3f4; border-right: 1px solid #eff3f4; }
  body.dark .col { border-color: #2f3336; }
  article, .cell { padding: 12px 16px; border-bottom: 1px solid #eff3f4; display: flex; flex-direction: row; gap: 8px; }
  body.dark article, body.dark .cell { border-color: #2f3336; }
  .cell { width: 100%; background: none; border-width: 0 0 1px; text-align: left; font: inherit; color: inherit; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #8ecdf8, #1d9bf0); flex: none; }
  .quote { margin-top: 10px; border: 1px solid #cfd9de; border-radius: 16px; padding: 10px 12px; }
  .ver { width: 18px; height: 18px; margin-left: 2px; fill: #1d9bf0; }
  .pill { font-size: 12px; padding: 0 4px; border-radius: 4px; background: #eff3f4; color: #536471; margin-left: 4px; }
  .btn { background: #0f1419; color: #fff; border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: 14px; }
  body.dark .btn { background: #eff3f4; color: #0f1419; }
  .bio { white-space: normal; margin-top: 2px; }
  .bio a { color: #1d9bf0; }
  h2 { font-size: 15px; margin: 0; padding: 12px 16px; border-bottom: 1px solid #eff3f4; }
</style>
</head>
<body>
<main class="col" data-testid="primaryColumn">
  <h2>Timeline</h2>
  <section id="timeline"></section>
  <h2>Verified Followers</h2>
  <section id="followers"></section>
  <h2>Following</h2>
  <section id="following"></section>
</main>
<script>
  const VERIFIED = '<svg class="ver" viewBox="0 0 22 22" data-testid="icon-verified" aria-label="Verified account" role="img"><path d="M20.4 11c0-1.4-.8-2.6-2-3.2.4-1.3.2-2.7-.8-3.6-1-1-2.4-1.2-3.6-.8C13.4 2.2 12.2 1.4 11 1.4S8.6 2.2 8 3.4c-1.3-.4-2.7-.2-3.6.8-1 1-1.2 2.4-.8 3.6C2.4 8.4 1.6 9.6 1.6 11s.8 2.6 2 3.2c-.4 1.3-.2 2.7.8 3.6 1 1 2.4 1.2 3.6.8.6 1.2 1.8 2 3.2 2s2.6-.8 3.2-2c1.3.4 2.7.2 3.6-.8 1-1 1.2-2.4.8-3.6 1.2-.6 2-1.8 2-3.2zm-10.6 4.5L6 11.7l1.4-1.4 2.4 2.4 5-5.2 1.5 1.3-6.5 6.7z"/></svg>';
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Mirrors the real tweet header captured from x.com (2026-10-09).
  // Quoted tweets render the same header without links.
  function header(name, handle, linked = true) {
    const A = linked ? (attrs) => `<a href="/${handle}" role="link" ${attrs || ''} class="v shrink">` : () => '<div class="v shrink">';
    const Z = linked ? '</a>' : '</div>';
    return `
      <div class="v row shrink" data-testid="User-Name">
        <div class="v row shrink">
          <div class="v shrink">
            ${A()}
              <div class="v row shrink">
                <div dir="ltr" class="t name"><span><span>${esc(name)}</span></span></div>
                <div dir="ltr" class="t ns"><span>${VERIFIED}</span></div>
              </div>
            ${Z}
          </div>
        </div>
        <div class="v row shrink">
          <div class="v row shrink">
            <div class="v shrink">
              ${A('tabindex="-1"')}<div dir="ltr" class="t muted"><span>@${handle}</span></div>${Z}
            </div>
            <div dir="ltr" aria-hidden="true" class="t muted"><span>&nbsp;·&nbsp;</span></div>
            <div class="v row"><a href="/${handle}/status/1" class="t muted"><time>2h</time></a></div>
          </div>
        </div>
      </div>`;
  }

  function tweetEl(id, user, quoted) {
    const art = document.createElement('article');
    art.dataset.testid = 'tweet';
    art.dataset.id = id;
    art.innerHTML = `
      <div class="avatar"></div>
      <div class="v grow">
        ${header(user.name, user.handle)}
        <div dir="auto" class="t">tweet ${esc(id)}</div>
        ${quoted ? `<div class="v quote">${header(quoted.name, quoted.handle, false)}<div dir="auto" class="t">quoted</div></div>` : ''}
      </div>`;
    return art;
  }

  // Mirrors the real UserCell: avatar link inside UserAvatar-Container, the name
  // link alone in a column wrapper, handle + "Follows you" on the next line,
  // Follow button in the outer row, bio below (may contain @mentions).
  // The follow button's data-testid ends in "-unfollow" when you follow them
  // (a div here: nested <button>s don't survive innerHTML parsing).
  function cellEl(user, bio, { followsYou = true, following = false } = {}) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'v cell';
    b.dataset.testid = 'UserCell';
    b.innerHTML = `
      <div class="v"><div class="v" data-testid="UserAvatar-Container-${user.handle}"><a href="/${user.handle}" aria-hidden="true" tabindex="-1" class="v"><div class="avatar"></div></a></div></div>
      <div class="v grow">
        <div class="v row" style="justify-content: space-between">
          <div class="v shrink">
            <div class="v shrink">
              <div class="v shrink">
                <a href="/${user.handle}" role="link" class="v shrink">
                  <div class="v row shrink">
                    <div dir="ltr" class="t name"><span><span>${esc(user.name)}</span></span></div>
                    <div dir="ltr" class="t ns"><span>${VERIFIED}</span></div>
                  </div>
                </a>
              </div>
              <div class="v row shrink">
                <div class="v shrink"><a href="/${user.handle}" role="link" tabindex="-1" class="v"><div class="v"><div dir="ltr" class="t muted"><span class="h">@${user.handle}</span></div></div></a></div>
                ${followsYou ? '<div class="v row"><div data-testid="userFollowIndicator" class="pill"><span>Follows you</span></div></div>' : ''}
              </div>
            </div>
          </div>
          <div class="v"><div role="button" class="btn" data-testid="${user.handle.length}${following ? '-unfollow' : '-follow'}"><span>${following ? 'Following' : 'Follow back'}</span></div></div>
        </div>
        <div dir="auto" class="t bio">${bio || ''}</div>
      </div>`;
    return b;
  }

  function usersIn(data) {
    const out = [];
    (function walk(o) {
      if (Array.isArray(o)) return o.forEach((v) => v && typeof v === 'object' && walk(v));
      if (o.__typename === 'Tweet') {
        const u = o.core.user_results.result;
        const q = o.quoted_status_result && o.quoted_status_result.result.core.user_results.result;
        out.push({ id: o.rest_id, user: { name: u.core.name, handle: u.core.screen_name }, quoted: q && { name: q.core.name, handle: q.core.screen_name } });
        return;
      }
      for (const k in o) if (o[k] && typeof o[k] === 'object') walk(o[k]);
    })(data);
    return out;
  }

  // Timeline over XHR (like x.com), followers over fetch.
  const xhr = new XMLHttpRequest();
  xhr.open('GET', '/i/api/graphql/V0wMxbYB/HomeTimeline?variables=%7B%7D');
  xhr.onload = () => {
    const tl = document.getElementById('timeline');
    for (const t of usersIn(JSON.parse(xhr.responseText))) tl.appendChild(tweetEl(t.id, t.user, t.quoted));
    // An author whose data never arrives: must stay badge-free.
    tl.appendChild(tweetEl('99', { name: 'No Data', handle: 'henry_nodata' }));
    // Your "Following" list: only alice follows you back.
    const following = document.getElementById('following');
    following.appendChild(cellEl({ name: 'Alice', handle: 'alice_ai' }, 'AI 产品经理', { following: true, followsYou: true }));
    following.appendChild(cellEl({ name: 'Bob Builder', handle: 'bob_builds' }, '', { following: true, followsYou: false }));
    following.appendChild(cellEl({ name: 'Dan', handle: 'dan_quotes' }, '', { following: true, followsYou: false }));
    window.__timelineReady = true;
  };
  xhr.send();

  fetch('/i/api/graphql/abc/BlueVerifiedFollowers').then((r) => r.json()).then((data) => {
    const list = document.getElementById('followers');
    const entries = data.data.user.result.timeline.timeline.instructions[0].entries;
    for (const e of entries) {
      const u = e.content.itemContent.user_results.result;
      const bio = u.core.screen_name === 'grace_lynne' ? 'TG: <a href="/alice_ai">@alice_ai</a>' : 'AIGC Builder | 分享喜爱';
      list.appendChild(cellEl({ name: u.core.name, handle: u.core.screen_name }, bio));
    }
    window.__mock.translate('frank_7');
    window.__followersReady = true;
  });

  window.__mock = {
    // Virtualised list: unmount a tweet and mount it again.
    remount(id) {
      const a = document.querySelector(`article[data-id="${id}"]`);
      const next = a.nextSibling;
      a.remove();
      const fresh = tweetEl(id, { name: a.querySelector('.name').textContent, handle: a.querySelector('a[tabindex="-1"]').getAttribute('href').slice(1) });
      next.parentNode.insertBefore(fresh, next);
    },
    // React reusing a header node for a different author.
    retarget(id, name, handle) {
      const un = document.querySelector(`article[data-id="${id}"] [data-testid="User-Name"]`);
      for (const a of un.querySelectorAll('a[href]')) a.setAttribute('href', a.getAttribute('href').replace(/^\/[^/]+/, '/' + handle));
      un.querySelector('.name span span').replaceWith(Object.assign(document.createElement('span'), { textContent: name }));
      const h = un.querySelector('a[tabindex="-1"] span');
      h.replaceChildren(document.createTextNode('@' + handle));
    },
    // Translation extensions append their own nodes inside the handle span.
    // Clicking "Following" → "Unfollow": X flips the button's data-testid in place.
    unfollow(handle) {
      const cell = [...document.querySelectorAll('#following [data-testid="UserCell"]')].find((c) => c.querySelector(`a[href="/${handle}"]`));
      const btn = cell.querySelector('[data-testid$="-unfollow"]');
      // Attribute only, no text change: proves the attribute observer alone catches it.
      btn.setAttribute('data-testid', btn.getAttribute('data-testid').replace('-unfollow', '-follow'));
    },
    translate(handle) {
      const span = document.querySelector(`[data-testid="UserCell"] a[href="/${handle}"] .h`);
      const extra = document.createElement('span');
      extra.className = 'notranslate';
      extra.textContent = '（已翻译）';
      span.appendChild(extra);
    },
  };
</script>
</body>
</html>
